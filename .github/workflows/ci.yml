name: TaskNest checks

on:
  push:
    branches:
      - main
      - feat/transparent-productivity-score
  pull_request:
    branches:
      - main

jobs:
  client:
    name: Client lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package.json
      - name: Install dependencies
        working-directory: client
        run: npm install
      - name: Lint
        working-directory: client
        run: npm run lint
      - name: Build
        working-directory: client
        run: npm run build

  server:
    name: Server scoring tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tasknest?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package.json
      - name: Install dependencies
        working-directory: server
        run: npm install
      - name: Generate Prisma Client
        working-directory: server
        run: npx prisma generate
      - name: Run scoring unit tests
        working-directory: server
        run: npm test
